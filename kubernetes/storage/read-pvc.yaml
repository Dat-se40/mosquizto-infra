apiVersion: v1
kind: Pod
metadata:
  name: storage-check
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.37.0
      command: [sh, -ec, 'test "$(cat /data/marker)" = "mosquizto-storage-ok"; echo storage-read-after-recreate-ok; sleep 3600']
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: storage-check}
